<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Cargar Partida</title>

  <link rel="stylesheet" href="../css/fondo.css">
  <link rel="stylesheet" href="../css/botom.css">
  <link rel="stylesheet" href="../css/help.css">
  <link rel="stylesheet" href="../css/fuente.css">

  <!-- TU modal.css -->
  <link rel="stylesheet" href="../css/modal.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

  <section
    style="position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center;">
    <img src="../img/gold_panel_8x.png" alt="Panel"
      style="position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;">

    <div
      style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 22px; width: 80%; height: 100%; box-sizing: border-box;">

      <h1 class="font-display" style="margin: 0 0 8px; font-size: 36px;">
        Cargar Partida
      </h1>

      <p class="font-text" style="margin: 0 0 6px; font-size: 16px; text-align:center;">
        Selecciona una partida guardada:
      </p>

      <div
        style="width: 100%; height: 180px; min-height: 180px; max-height: 180px; overflow-y: auto; border: 1px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.2); box-sizing: border-box;">
        <table class="font-text" style="width: 100%; border-collapse: collapse; color: white;">
          <thead style="position: sticky; top: 0; background: #2a2a2a; font-size: 14px; color: #ffd700;">
            <tr>
              <th class="font-display" style="padding: 8px; border-bottom: 1px solid #ffd700;">PartidaID</th>
              <th class="font-display" style="padding: 8px; border-bottom: 1px solid #ffd700;">IdJugador 1</th>
              <th class="font-display" style="padding: 8px; border-bottom: 1px solid #ffd700;">IdJugador 2</th>
            </tr>
          </thead>

          <tbody id="listaPartidas" class="font-text" style="text-align: center; font-size: 14px; cursor: pointer;">
          </tbody>
        </table>
      </div>

      <button id="btnCargar" class="boton font-display" type="button"
        style="font-size: 14px; width: 190px; height: 42px; opacity: 0.6;" disabled>
        Cargar
      </button>

      <button id="btnEliminar" class="boton font-display" type="button"
        style="font-size: 14px; width: 190px; height: 42px; opacity: 0.6; display: none;" disabled>
        Eliminar
      </button>

      <form action="menu.html" method="get" style="margin:0;">
        <button id="btnVolverMenu" class="boton font-display" type="submit" style="
      font-size: 14px;
      width: 190px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-family: inherit;
    ">
          Volver al Menu
        </button>
      </form>

    </div>
  </section>

  <!-- ===== MODAL ELIMINAR ===== -->
  <div id="modalEliminar" class="modal-overlay oculto">
    <div class="modal-content">
      <h2 id="modalEliminarTexto" class="font-display">
        ¿Desea eliminar la partida?
      </h2>

      <div class="modal-buttons">
        <button id="btnEliminarSi" class="boton font-display" type="button">SI</button>
        <button id="btnEliminarNo" class="boton font-display" type="button">NO</button>
      </div>
    </div>
  </div>

  <script src="../js/help.js"></script>
  <script src="../js/cargar_partida.js"></script>

</body>

</html>
