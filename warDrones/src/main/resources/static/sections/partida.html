<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida</title>

    <link rel="stylesheet" href="../css/fondo.css">
    <link rel="stylesheet" href="../css/botom.css">
    <link rel="stylesheet" href="../css/fuente.css">

    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #24323d;
            border: 4px solid #6a4a1c;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
        }

        .modal-content h2 {
            color: #fff;
            margin-top: 0;
            font-size: 28px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body style="margin: 0; min-height: 100vh; display: flex; align-items: stretch;">
    <aside
        style="width: 25vw; min-width: 260px; max-width: 380px; position: relative; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
        <img src="../img/gold_panel_8x.png" alt="Panel"
            style="position: absolute; inset: 16px; width: calc(100% - 32px); height: calc(100% - 32px); image-rendering: pixelated;">

        <div
            style="position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;">

            <h1 class="font-display" style="margin: 0 0 6px; font-size: 46px; text-align: center;">Partida</h1>

            <button id="btnSalir" class="boton boton-menu font-display" type="button" style="font-size: 18px;">
                Salir
            </button>

            <!-- El botón 'Volver al Menu' fue removido porque ahora hay un submenu con opciones abandon/guardar -->
            <section
                style="width: 100%; max-width: 280px; background: rgba(19, 31, 38, 0.75); border: 2px solid #f2cb67; padding: 10px; box-sizing: border-box; color: #f7e7b2;">

                <p id="bandoLabel" class="font-display" style="margin: 0 0 4px; font-size: 24px;">Bando: -</p>

                <!-- HUD drone labels removed (info shown on canvas) -->
                <p id="turnHint" class="font-text" style="margin: 0 0 6px; font-size: 16px; color: #f7e7b2;">
                    Esperando partida...
                </p>

                <p id="setupHint" class="font-text" style="margin: 0 0 6px; font-size: 16px;">
                    Elige un dron y pulsa Desplegar.
                </p>

                <button id="deployDroneBtn" class="boton font-display" type="button"
                    style="font-size: 16px; width: 100%; height: 34px; margin-bottom: 8px;">
                    Desplegar Dron
                </button>

                <button id="nextDroneBtn" class="boton font-display" type="button"
                    style="font-size: 16px; width: 100%; height: 34px; margin-bottom: 8px;">
                    Cambiar Dron
                </button>

                <!-- nuevos botones de acción - ocultos inicialmente hasta desplegar todos los drones -->
                <button id="moveBtn" class="boton font-display" type="button"
                    style="font-size: 16px; width: 100%; height: 34px; margin-bottom: 8px; display: none;">
                    Movimiento
                </button>

                <button id="attackBtn" class="boton font-display" type="button"
                    style="font-size: 16px; width: 100%; height: 34px; margin-bottom: 8px; display: none;">
                    Atacar
                </button>

                <button id="reloadBtn" class="boton font-display" type="button"
                    style="font-size: 16px; width: 100%; height: 34px; margin-bottom: 8px; display: none;">
                    Recargar
                </button>

                <!-- NO TOCAR (tabla/lista que aparece) -->
                <div id="fleetList"
                    style="max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;"></div>
            </section>
        </div>
    </aside>

    <main style="width: 75vw; padding: 16px 16px 16px 0; box-sizing: border-box; display: flex; align-items: stretch;">
        <canvas id="mapCanvas"
            style="width: 100%; height: calc(100vh - 32px); border: 4px solid #6a4a1c; box-sizing: border-box; background: #24323d; cursor: pointer;"></canvas>
    </main>

    <div id="modalSalir" class="modal">
        <div class="modal-content">
            <h2 class="font-display">¿Deseas salir?</h2>
            <div class="modal-buttons">
                <button id="btnConfirmarSalir" class="boton boton-menu font-display" style="font-size: 16px;">
                    Abandonar
                </button>
                <button id="btnGuardar" class="boton boton-menu font-display" style="font-size: 16px;">
                    Guardar
                </button>
                <button id="btnCancelar" class="boton boton-menu font-display" style="font-size: 16px;">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <div id="modalVictoria" class="modal">
        <div class="modal-content">
            <h2 class="font-display">Partida finalizada</h2>
            <h3 id= "lblGanador" class="font-display"></h3>
            <div class="modal-buttons">
                <button id="btnCerrarPartida" class="boton boton-menu font-display" style="font-size: 16px;">
                    Salir
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para seleccionar bando (solo usuario 1) -->
    <div id="modalSeleccionarBando" class="modal">
        <div class="modal-content">
            <h2 class="font-display">Selecciona tu Bando</h2>
            <div class="modal-buttons">
                <button id="btnBandoNaval" class="boton boton-menu font-display" style="font-size: 16px;">
                    Dron Naval
                </button>
                <button id="btnBandoAereo" class="boton boton-menu font-display" style="font-size: 16px;">
                    Dron Aéreo
                </button>
            </div>
        </div>
    </div>

    <script src="../js/gameState.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/partida.js"></script>
    <script src="../js/partida_ui.js"></script>
    <script>
        // Este string puede venir de URL, BD, session, etc.
        // Si otro modulo ya define un valor, usa window.BANDO_ENTRADA.
        const bandoEntradaRaw = window.BANDO_ENTRADA ?? new URLSearchParams(window.location.search).get('bando') ?? 'aereo';
        const partidaApp = new PartidaApp(bandoEntradaRaw);

        // Funciones comunes
        partidaApp.cargarSpritePortaNaval();
        partidaApp.cargarSpritePortaAereo();
        partidaApp.ajustarCanvasBase();
        partidaApp.reiniciarNiebla();
        partidaApp.posicionarPortaNaval();
        partidaApp.posicionarPortaAereo();
        partidaApp.crearFlotaSegunBando();

        /* Cargar sprite segun bando de URL, pero NO revelar aun (los bandos se confirmaran en inicializarPartida) */
        if (partidaApp.esNaval()) {
            partidaApp.cargarSpriteDronNaval();
        } else {
            partidaApp.cargarSpriteDronAereo();
        }

        /* Iniciar el loop de animacion; la revelacion ocurrira en inicializarPartida si bandos estan confirmados */
        partidaApp.iniciarLoop();
    </script>
</body>

</html>
