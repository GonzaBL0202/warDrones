<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Menu Principal</title>

    <link rel="stylesheet" href="../css/fondo.css">
    <link rel="stylesheet" href="../css/botom.css">
    <link rel="stylesheet" href="../css/help.css">
    <!-- Fuente global -->
    <link rel="stylesheet" href="../css/fuente.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <section
        style="position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center;">
        <img src="../img/gold_panel_8x.png" alt="Panel"
            style="position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;">

        <div
            style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;">

            <!-- TITULO -->
            <h1 class="font-display" style="margin: 0 0 10px; font-size: 36PX;">
                Menú Principal
            </h1>

            <!-- TEXTO COMUN -->
            <p class="font-text" style="margin: 0 0 18px; font-size: 16px;">
                Usuario: <span id="nombreUsuario" class="font-text"></span>
            </p>

            <form action="crear-partida.html" method="get">
                <button class="boton boton-menu font-display" type="submit" style="font-size: 14px;">
                    Iniciar Partida
                </button>
            </form>

            <form action="cargar-partida.html" method="get">
                <button class="boton boton-menu font-display" type="submit" style="font-size: 14px;">
                    Cargar Partida
                </button>
            </form>

            <form action="ranking.html" method="get">
                <button class="boton boton-menu font-display" type="submit" style="font-size: 14px;">
                    Ranking
                </button>
            </form>

            <form action="../index.html" method="get">
                <button class="boton boton-menu font-display" type="submit" style="font-size: 14px;">
                    Salir
                </button>
            </form>

        </div>
    </section>

    <script src="../js/help.js"></script>

    <script>
        Help.init({
            title: "Ayuda - Menú",
            items: [
                "Inicia una nueva partida.",
                "Carga una partida guardada.",
                "Revisa en que puesto del ranking estás."
            ]
        });
    </script>

    <script src="../js/menu.js"></script>

</body>

</html>
