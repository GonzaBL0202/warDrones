<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lobby</title>

    <link rel="stylesheet" href="../css/fondo.css">
    <link rel="stylesheet" href="../css/botom.css">
    <link rel="stylesheet" href="../css/fuente.css">
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

    <div style="position: absolute; top: 10px;">
        <img src="../img/logo.png" alt="Logo WarDrones" style="width: 300px; height: auto;">
    </div>


    <section
        style="position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center;">

        <img src="../img/gold_panel_8x.png" alt="Panel"
            style="position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;">

        <div
            style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 80%; padding-top: 30px;">

            <!-- TITULO -->
            <h1 class="font-display" style="margin: 0 0 12px; font-size: 36px;">
                Lobby
            </h1>

            <!-- TEXTO -->
            <p class="font-text" style="margin: 0 0 6px; font-size: 16px; text-align: center;">
                Esperando rival<span id="dots">...</span>
            </p>

            <p class="font-text" style="margin: 0 0 14px; font-size: 14px;">
                Partida: #<span id="partidaIdTxt"></span>
            </p>

            <!-- BOTON -->
            <button id="btnCancelar" class="boton font-display" type="button"
                style="font-size: 14px; width: 190px; height: 42px;">
                Cancelar
            </button>

        </div>
    </section>

    <script src="../js/lobby.js"></script>

</body>

</html>
